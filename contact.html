<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt — kreativstep</title>
<meta name="description" content="Kontakt zu kreativstep aufnehmen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">kreativ<em>step</em></a>
    <button class="nav-toggle" aria-expanded="false">Menü</button>
    <nav class="nav-links">
      <a href="index.html">Start</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">Über mich</a>
      <a href="contact.html" aria-current="page">Kontakt</a>
    </nav>
  </div>
</header>

<main>
  <section class="wrap contact" style="padding-top: var(--space-xl);">
    <span class="eyebrow">Kontakt</span>
    <h1>Erzähl mir von deiner Idee</h1>
    <p>Ob Projektanfrage, Zusammenarbeit oder einfach nur Hallo sagen — ich freue mich, von dir zu hören.</p>

    <form class="contact-form" action="#" method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="message">Nachricht</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn--accent">Nachricht senden</button>
    </form>

    <div class="contact-alt">
      Oder direkt per E-Mail: <a href="mailto:hallo@kreativstep.de" class="btn" style="margin-top: 0.5rem;">hallo@kreativstep.de</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="logo">kreativ<em>step</em></div>
    <div class="footer-links">
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">Über mich</a>
      <a href="contact.html">Kontakt</a>
    </div>
    <p>&copy; 2026 kreativstep</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
